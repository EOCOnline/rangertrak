<!-- Simplified datetime picker using native Angular Material -->
<div class="rt-datetime">
  <mat-form-field class="rt-datetime__field" appearance="outline" subscriptSizing="dynamic">
    <input matInput [matDatepicker]="picker" [formField]="timeForm.time" [attr.aria-label]="datePickerLabel"
      class="timepicker__When-input" data-lpignore="true" [attr.tabindex]="dateTabIndex ?? null"
      (dateChange)="onNewTime()" />

    <mat-datepicker-toggle matSuffix [for]="picker" title="Click me to display a date picker">
    </mat-datepicker-toggle>

    <mat-datepicker #picker></mat-datepicker>
  </mat-form-field>

  <span class="rt-datetime__divider"></span>

  <!-- 2026-08-22: replaces a native <input type="time">. Three plain segments instead of
       one opaque control - see the component's own comment on why this was necessary, not
       just nicer: JS cannot ask a native time input which of its internal segments is
       focused, which is exactly what the shared ▲/▼ stepper below needs to know. -->
  <span class="rt-datetime__time" role="group" [attr.aria-label]="datePickerLabel + ' time'">
    <input #hourInput type="number" inputmode="numeric" min="1" max="12" step="1"
      class="rt-datetime__seg rt-datetime__seg--hour" [value]="hourDisplay()"
      [attr.aria-label]="datePickerLabel + ' hour'" [attr.tabindex]="ti(0)" data-lpignore="true"
      (focus)="onSegmentFocus('hour')" (change)="onHourChange($event)"
      (input)="onSegmentTyping($event, 1, minuteInput)"
      (keydown.arrowup)="onSegmentKeyStep($event, 'hour', 1)"
      (keydown.arrowdown)="onSegmentKeyStep($event, 'hour', -1)" />
    <span class="rt-datetime__colon" aria-hidden="true">:</span>
    <input #minuteInput type="number" inputmode="numeric" min="0" max="59" step="1"
      class="rt-datetime__seg rt-datetime__seg--minute" [value]="minuteDisplay()"
      [attr.aria-label]="datePickerLabel + ' minute'" [attr.tabindex]="ti(1)" data-lpignore="true"
      (focus)="onSegmentFocus('minute')" (change)="onMinuteChange($event)"
      (input)="onSegmentTyping($event, 5, meridiemBtn)"
      (keydown.arrowup)="onSegmentKeyStep($event, 'minute', 1)"
      (keydown.arrowdown)="onSegmentKeyStep($event, 'minute', -1)" />
    <button #meridiemBtn type="button" class="rt-datetime__seg rt-datetime__seg--meridiem"
      [attr.aria-label]="datePickerLabel + ' AM or PM'" [attr.tabindex]="ti(2)"
      (focus)="onSegmentFocus('meridiem')" (click)="toggleMeridiem()"
      (keydown.arrowup)="onSegmentKeyStep($event, 'meridiem', 1)"
      (keydown.arrowdown)="onSegmentKeyStep($event, 'meridiem', -1)">{{ meridiem() }}</button>
  </span>

  <!-- E-50: the native time input's own up/down arrows are easy to miss - these are an
       explicit, always-visible affordance for the same one-minute step the arrow keys
       already do while a field is focused. 2026-08-22: now steps whichever segment
       (hour/minute/AM-PM) was last focused, not always minutes - see adjustTime(). -->
  <span class="rt-datetime__stepper">
    <button type="button" class="rt-datetime__step" (click)="adjustTime(1)"
      title="Step up the last-focused field" aria-label="Step up the last-focused field">&#9650;</button>
    <button type="button" class="rt-datetime__step" (click)="adjustTime(-1)"
      title="Step down the last-focused field" aria-label="Step down the last-focused field">&#9660;</button>
  </span>
</div>
