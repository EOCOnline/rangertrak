<!-- Raised live 2026-08-30: this dot used to carry its own separate hover tooltip
     (readiness breakdown) - since this component is only ever embedded inside
     HeaderComponent's own status-cluster pill, that meant hovering the tiny dot showed one
     panel while hovering the rest of the pill showed a different one. HeaderComponent's own
     .rt-mission-info-panel now includes this same readiness breakdown (ported from this
     component's own items/tooltip getters below), so this is just the dot + its accessible
     name; `title` is enough to explain it in isolation via keyboard/AT if the dot itself
     receives focus outside the pill's own hover panel. -->
<!-- [routerLink]="null" on a touch device deliberately renders an inert (non-navigating)
     anchor - see onDotClick()'s own doc comment for why the touch case cannot just call
     preventDefault() instead. -->
<a class="readiness-dot" [routerLink]="isTouchOnly() ? null : '/mission'" (click)="onDotClick()"
  [class.readiness-dot--red]="readiness.level() === 'red'"
  [class.readiness-dot--amber]="readiness.level() === 'amber'"
  [class.readiness-dot--green]="readiness.level() === 'green'"
  [attr.title]="tooltip" [attr.aria-label]="tooltip + '. Go to Mission to resolve issues.'" role="img"></a>
