<!-- hr class="rule"-->
<!-- E-57(1): the readiness dot, mission info, op-period timers and clock used to be four
     independent flex items spread by `justify-content: space-between` - fine when all four
     have content, but with nothing set yet (a fresh install, or the maintainer's own
     screenshots mid-setup) it read as scattered fragments ("#:" floating alone, a lone "&").
     Grouped into one visual cluster instead, with dividers, so it reads as one status
     readout rather than several independent pieces of debris. -->
<div class="header">
  <h1 class="title" title="{{pageDescription}}">{{parentTitle}} </h1>
  <div class="header__right">
    <div class="status-cluster" (click)="onStatusClusterClick($event)"
    title="Click to go to Field Entry and reopen the welcome panel">
    <rangertrak-mission-readiness></rangertrak-mission-readiness>
    <span class="status-divider"></span>
    <span class="event" title={{eventDetails()}}>{{eventInfo()}}</span>
    <span class="status-divider"></span>
    <span class="opPeriod" title={{opPeriodDetails()}}>{{opPeriod()}} {{timeElapsed$ | async}} &
      {{timeLeft$ | async}}</span>
    <span class="status-divider"></span>
    <span class="clock">{{timeCurrent | async | date: 'MMM d, hh:mm:ss'}}</span>
    </div>

    <!-- Material-M3 pass, 2026-08-25: the single entry point to this screen's reference
         material, in the same place on every page. What it opens used to be
         <rangertrak-section> blocks ("Instructions", "Tips", "Privacy & data handling",
         "Grid Menu Keyboard interaction") sitting permanently below each page's grid or
         form. Rendered only where there is something to read. -->
    @if (guide.available()) {
    <button matButton="outlined" type="button" class="header__guide" (click)="guide.toggle()"
      [attr.aria-expanded]="guide.isOpen()"
      title="Instructions, tips and keyboard help for this screen">
      <mat-icon>help_outline</mat-icon>
      Guide
    </button>
    }
  </div>
</div>
