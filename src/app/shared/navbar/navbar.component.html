<!-- https://material.io/components/menus
 mdc-top-app-bar
 -->

<nav class="main-nav">
  <!-- E-63b: the brand mark IS the Home affordance now - the separate "Home" nav item is
       gone. Icon is favicon.svg's own path (Material's "explore"/compass mark, already the
       app's real icon per E-42/E-62 - not a new logo), inlined with currentColor so it
       follows .title's colour with no separate asset request. routerLinkActive mirrors
       what "Home" used to show: active only on an exact match, not on every route (this
       link's target). -->
  <span title="RangerTrak" class="title">
    <a class="brand" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
      <svg class="brand-icon" width="26" height="26" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path
          d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-5.5-2.5l7.51-3.49L17.5 6.5 9.99 9.99 6.5 17.5zm5.5-6.6c.61 0 1.1.49 1.1 1.1s-.49 1.1-1.1 1.1-1.1-.49-1.1-1.1.49-1.1 1.1-1.1z"
          fill="currentColor" />
      </svg>
      RangerTrak™
    </a>
  </span>

  <ul>
    <!-- D-31 named these by what a scribe reaches for, not by engine, back when the two
         engines shipped as separate nav items/pages. E-64 collapsed that to one page: one
         route, Leaflet shown by default, with an on-page switch to try MapLibre + PMTiles.
         So there is only one nav item now; the reasoning behind the label survives, it just
         has nothing left to disambiguate. -->
    <li><a [routerLink]="['/map']" routerLinkActive="active"
        title="Detailed worldwide map (Leaflet + OpenStreetMap) by default, with a switch to try the bundled MapLibre + PMTiles backup engine.">Map</a>
    </li>
    <li><a [routerLink]="['/reports']" routerLinkActive="active">Reports</a></li>
    <li><a [routerLink]="['/rangers']" routerLinkActive="active">Rangers</a></li>
    <li><a [routerLink]="['/mission']" routerLinkActive="active">Mission</a></li>
    <!-- Renamed from "Help" to "Help" - the maintainer's framing: "Too many confusing
         things are on the main menu!" Log's own nav item is gone the same day; it's
         reachable from this Help page instead (see help.component.html). Route stays
         /help - every internal link already uses routerLink, not a hardcoded path. -->
    <li><a [routerLink]="['/help']" routerLinkActive="active">Help</a></li>
    <li *ngIf="isNavigating()" class="Navbar__progressBar">Loading... <span class="smaller"> (Please 'Refresh' the
        page.)</span>
      <mat-progress-bar mode="indeterminate">
      </mat-progress-bar>
    </li>
  </ul>


  <!--================================================-->
  <span class="rightAlign">

    <!-- Light/dark override. 'auto' follows the OS/browser scheme (styles/_tokens.scss's
         light-dark() default); 'light'/'dark' pin it. A sun/moon toggle beats relying on the
         OS setting alone here - a scribe's device theme rarely tracks actual field light,
         daylight glare vs. a dim vehicle cab at night, the way it would used indoors all day. -->
    <button type="button" class="theme-toggle" (click)="theme.cycle()"
      [attr.aria-label]="'Theme: ' + theme.mode() + '. Click to change.'"
      [title]="'Theme: ' + theme.mode() + ' (click to change)'">
      @if (theme.mode() === 'light') {
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
        <circle cx="12" cy="12" r="5" fill="currentColor" />
        <g stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="12" y1="1" x2="12" y2="3" />
          <line x1="12" y1="21" x2="12" y2="23" />
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
          <line x1="1" y1="12" x2="3" y2="12" />
          <line x1="21" y1="12" x2="23" y2="12" />
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
        </g>
      </svg>
      } @else if (theme.mode() === 'dark') {
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" fill="currentColor" />
      </svg>
      } @else {
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
        <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2" />
        <path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor" />
      </svg>
      }
    </button>

    <!-- E-57(1) follow-up: install/update used to render here too, plus the footer's
         [stickyBottom] instance, plus a separate MatSnackBar UpdateService opened
         directly - three surfaces for the same "update ready" notice. Maintainer: "New
         version available shows up in three places. 1 is probably enough. (footer)." The
         footer's floating instance already guarantees visibility regardless of scroll
         and covers both states (install offer and update-ready), so this copy and the
         snackbar are both gone rather than trying to keep this one install-offer-only. -->
    <a href=" https://github.com/EOCOnline/rangertrak" target="_blank"
      title="See ya at GitHub for issue reports & source code" class="git">
      <img src="../../assets/icons/GitHub-Mark-32px.png" id="gitLogo" alt="GitHub" width="32" height="32" /></a>

  </span>
</nav>
