<!-- https://material.io/components/menus
 mdc-top-app-bar
 -->

<nav class="main-nav">
  <span title="RangerTrak" class="title">
    <a href="https://www.RangerTrak.org" title="https://RangerTrack.org" target="_blank">RangerTrak™
      <!--fa-icon [icon]="faMapMarkedAlt" class="fa-lg"></fa-icon
      https://en.wikipedia.org/wiki/Trademark
    -->
    </a>
  </span>

  <ul>
    <li>
      <a [routerLink]="['/']" routerLinkActive="active" [routerLinkActiveOptions]="{exact:
      true}">Home</a>
    </li>
    <!-- D-31. These were "Map (Leaflet)" and "Map (MapLibre+PMTiles)": a development
         decision (two engines shipping side by side until usage picks one) that had leaked
         into the operator's navigation. Neither is "the offline one" - both work offline,
         differently - so the honest short names come from which one a scribe reaches for.
         Leaflet is detailed and world-wide but its offline coverage must be prepared
         deliberately; PMTiles is coarse and Vashon-only but is always there once warmed.
         So: the primary takes the plain name, the fallback is the backup. Engine names
         survive in the titles, for us, not for the scribe. -->
    <li><a [routerLink]="['/lmap']" routerLinkActive="active"
        title="Detailed worldwide map (Leaflet + OpenStreetMap). Needs a connection unless you have saved this area for offline use.">Map</a>
    </li>
    <li><a [routerLink]="['/map']" routerLinkActive="active"
        title="Bundled fallback map (MapLibre + PMTiles). Works with no connection once opened, but covers the pilot region only and has no street names.">Backup
        map</a></li>
    <li><a [routerLink]="['/reports']" routerLinkActive="active">Reports</a></li>
    <li><a [routerLink]="['/rangers']" routerLinkActive="active">Rangers</a></li>
    <li><a [routerLink]="['/settings']" routerLinkActive="active">Settings</a></li>
    <li><a [routerLink]="['/about']" routerLinkActive="active">About</a></li>
    <li><a [routerLink]="['/log']" routerLinkActive="active">Log</a></li>
    <li *ngIf="isNavigating" class="Navbar__progressBar">Loading... <span class="smaller"> (Please 'Refresh' the
        page.)</span>
      <mat-progress-bar mode="indeterminate">
      </mat-progress-bar>
    </li>
  </ul>


  <!--================================================-->
  <span class="rightAlign">

    <!-- E-37: was `*ngIf=isInstallable onclick="onInstallBtn()"` - shown always, and the
         click resolved against window, where no such function exists. Now a real button,
         gated on the browser actually offering installation. -->
    @if (isInstallable) {
    <button type="button" (click)="onInstallBtn()" class="installBtn"
      title="Install RangerTrak on this device: uses almost no storage, works offline, and gives you an icon to return to.">
      <img src="../../assets/icons/install.png" height="18px" width="18px" alt="" aria-hidden="true" />
      <span>Install</span>
    </button>
    }
    &nbsp;
    <a href=" https://github.com/EOCOnline/rangertrak" target="_blank"
      title="See ya at GitHub for issue reports & source code" class="git">
      <img src="../../assets/icons/GitHub-Mark-32px.png" id="gitLogo" /></a>

  </span>

  <form>
    <input type="search" placeholder="(Future) Search" />
    <button>Go</button>
    <!--button (click)="Search()" type="search" placeholder="(Future) Search"> (Future) Search</button-->
  </form>
</nav>
