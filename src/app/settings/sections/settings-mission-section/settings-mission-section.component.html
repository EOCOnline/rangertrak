<div>
  <!-- ======================================= -->
  <h2>Mission</h2>
  <div class="input-group">
    <span class="strong">ID or #: </span>
    <input [formField]="form.mission" placeholder="Mission #" [style.width.px]="100" type="text"
      data-lpignore="true" />
  </div>

  <div class="input-group">
    <span class="strong">Name: </span>
    <input [formField]="form.event" placeholder="Event Name" [style.width.px]="100" type="text" data-lpignore="true" />
  </div>

  <div class="input-group">
    <span class="strong">Notes: </span><br />
    <textarea appearance="fill" [formField]="form.eventNotes" class="input-group settings__OpPeriod--notes" cols="60"
      rows="4" placeholder="Event description, if needed"></textarea>
  </div>

  <!-- ======================================= -->
  <div class="input-group">
    <h2>Operational Period</h2>
    Name: <input [formField]="form.opPeriod" placeholder="Operational Period" [style.width.px]="120" type="text"
      data-lpignore="true" />
  </div>

  <!-- ======================================= -->
  <div class="filled timepicker">
    <rangertrak-time-picker [initialDate]="opPeriodStart" [datePickerLabel]="timePickerLabelStart"
      (newTimeEvent)="timeEventStart.emit($event)">
    </rangertrak-time-picker>
  </div>

  <div class="filled timepicker">
    <rangertrak-time-picker [initialDate]="opPeriodEnd" [datePickerLabel]="timePickerLabelEnd"
      (newTimeEvent)="timeEventEnd.emit($event)"></rangertrak-time-picker>
  </div>
</div>
