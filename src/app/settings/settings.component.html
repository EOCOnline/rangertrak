<rangertrak-page [title]="title" [description]="pageDescr">

  <!-- E-55: was this page's own install panel - raw hex colours, a fixed 250px width,
       opacity:0.8 - styled differently from the navbar's and footer's own separate
       implementations of the same concept. See InstallUpdateComponent's doc comment.
       `detailed` keeps this page's fuller explanation; navbar/footer get the compact form. -->
  <rangertrak-install-update [detailed]="true"></rangertrak-install-update>

  <!-- E-79: which specific gap(s) are behind the header's red/amber readiness dot, not
       just the aggregate colour - never shown once every signal is green. -->
  @if (readinessGaps().length > 0) {
  <div class="readiness-gaps" role="note" aria-label="Mission readiness gaps">
    <p class="readiness-gaps__heading">Affecting mission readiness on this device:</p>
    <ul>
      @for (gap of readinessGaps(); track gap.label) {
      <li class="readiness-gaps__item" [class.readiness-gaps__item--red]="gap.severity === 'red'"
        [class.readiness-gaps__item--amber]="gap.severity === 'amber'">
        {{ gap.label }}
        @if (gap.link) {
        <a [routerLink]="gap.link">{{ gap.linkText }}</a>
        }
      </li>
      }
    </ul>
  </div>
  }

  <form (ngSubmit)="onFormSubmit()">
    <br />

    <rangertrak-settings-mission-section [form]="settingsForm" [opPeriodStart]="opPeriodStart()"
      [opPeriodEnd]="opPeriodEnd()" [timePickerLabelStart]="timePickerLabelStart"
      [timePickerLabelEnd]="timePickerLabelEnd" (timeEventStart)="onNewTimeEventStart($event)"
      (timeEventEnd)="onNewTimeEventEnd($event)">
    </rangertrak-settings-mission-section>

    <rangertrak-settings-location-section [form]="settingsForm" [settings]="settings">
    </rangertrak-settings-location-section>

    <rangertrak-settings-maps-section [form]="settingsForm"></rangertrak-settings-maps-section>

    <rangertrak-settings-field-report-statuses [rowData]="rowData()"></rangertrak-settings-field-report-statuses>

    <rangertrak-settings-recipients213 [options]="recipientOptions213()"
      (optionsChange)="onRecipientOptions213Change($event)"></rangertrak-settings-recipients213>

    <rangertrak-settings-instructions></rangertrak-settings-instructions>

    <!-- ======================================= -->
    <h2>Debug</h2>

    <div class="input-group">
      <input type="checkbox" [formField]="settingsForm.debugMode" placeholder="debugMode" />
      <span class="strong">Debug Mode</span>
    </div>

    <br />

    <span class="strong">Save all settings above: </span>
    <button [disabled]="settingsForm().invalid()" class="settings__Save-button eButton" type="submit">Save</button>
    <!-- button tabindex="9" -->


    <br />
    <br />

    <!-- ======================================= -->
    <rangertrak-settings-advanced-options (resetDefaults)="onBtnResetDefaults()">
    </rangertrak-settings-advanced-options>
  </form>
</rangertrak-page>
