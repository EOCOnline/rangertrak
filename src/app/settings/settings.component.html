<rangertrak-page [title]="title" [description]="pageDescr">

  <!-- E-37: was shown unconditionally (the service's `installableEvent` started as a truthy
       `1`), with a click that resolved against `window`. Now gated on the browser actually
       offering installation, and wired to the service that owns it. -->
  @if (isInstallable) {
  <div class="installMe">
    Install application on this browser to...
    <ul>
      <li>Permit offline viewing of leaflet maps</li>
      <li>Provide a convenient icon to quickly return to the application</li>
      <li>(Requires little storage)</li>
    </ul>

    <button type="button" (click)="onInstallBtn()" class="installBtn"
      title="Install RangerTrak on this device: uses almost no storage, works offline, and gives you an icon to return to.">
      <img src="../../assets/icons/install.png" height="18px" width="18px" alt="" aria-hidden="true" />
      <span>Install</span>
    </button>
  </div>
  }

  <form [formGroup]="settingsEditorForm" (ngSubmit)="onFormSubmit()">
    <br />

    <rangertrak-settings-instructions></rangertrak-settings-instructions>

    <rangertrak-settings-mission-section [form]="settingsEditorForm" [opPeriodStart]="opPeriodStart"
      [opPeriodEnd]="opPeriodEnd" [timePickerLabelStart]="timePickerLabelStart"
      [timePickerLabelEnd]="timePickerLabelEnd" (timeEventStart)="onNewTimeEventStart($event)"
      (timeEventEnd)="onNewTimeEventEnd($event)">
    </rangertrak-settings-mission-section>

    <rangertrak-settings-location-section [form]="settingsEditorForm" [settings]="settings">
    </rangertrak-settings-location-section>

    <rangertrak-settings-maps-section [form]="settingsEditorForm"></rangertrak-settings-maps-section>

    <rangertrak-settings-field-report-statuses [rowData]="rowData"></rangertrak-settings-field-report-statuses>

    <!-- ======================================= -->
    <h2>Debug</h2>

    <div class="input-group">
      <input type="checkbox" formControlName="debugMode" placeholder="debugMode" />
      <span class="strong">Debug Mode</span>
    </div>

    <!-- TODO: future: [ ] enable touch user interface<br>-->

    <br />

    <span class="strong">Save all settings above: </span>
    <button [disabled]="settingsEditorForm.invalid" class="settings__Save-button eButton" type="submit">Save</button>
    <!-- button tabindex="9" -->


    <br />
    <br />

    <!-- ======================================= -->
    <rangertrak-settings-advanced-options (resetDefaults)="onBtnResetDefaults()">
    </rangertrak-settings-advanced-options>
  </form>
</rangertrak-page>
