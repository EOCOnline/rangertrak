<div class="lmap-container">
  <h2 class="Entry__LMap-head">Current Location</h2>
  <div class="lmap-frame">
    <div #mapContainer id="entry-minimap" (click)="onMouseClick($event)"></div>
  </div>

  <!-- https://angular.io/api/common/DecimalPipe#digitsinfo -->
  <div class="Entry__LMap-footer">
    <!-- Hidden at tablet-down (see .Entry__LMap-footer-coords in mini-lmap.component.scss)
         - redundant once the map sits directly under the Where section's own, fuller
         DD/DDM/DMS/MGRS/UTM readout, and this exact text was what was wrapping the shrunk
         map's box into a tall, awkward sliver instead of a compact thumbnail. -->
    <span class="Entry__LMap-footer-coords">
      Latitude: <span class="strong">{{mouseLatLng().lat.toFixed(5)}}</span> Longitude:
      <span class="strong">{{mouseLatLng().lng.toFixed(5)}}</span> Zoom:
      <span class="strong">{{zoom()}}</span>
    </span>

    <div #statusEl id="Entry__LMinimap-status">{{clickStatus()}}</div>
  </div>
  <!--div id="Entry__LMinimap-debug">
    <span class="small">And meanwhile, back in the mini-map:
      lat: {{locationUpdated.lat}};
      lng:{{locationUpdated.lng}};<br>
      addr:{{locationUpdated.address}}; {{locationUpdated.derivedFromAddress}}</span><br>
    <! --
    <button (click)="forceMarker()" title="Force a marker to be displayed..." class="eButton" type="button">
      Force Marker
    </button>
  </div-->
</div>
