<div class="container enter__Where-div">
  <form appearance="filled" class="enter__Where-input">


    <!------------------------------------------------------------>
    <div class="input-group">
      &nbsp;&nbsp;&nbsp;Latitude:


      <span>
        <input #latI [formField]="ddForm.latI" type="number" (change)="onDdChg()" min="-180" max="180"
          id="enter__Where-latI" />

        <!--span *ngIf="location.get('latI')?.touched && location.get('latI')?.hasError('required')"
          class="text-sm text-danger">lat is required
          [class.border-danger]="location.get('latD')?.touched && location.get('latD')?.invalid"
        </span-->

        <strong>.</strong>
        <input #latF [formField]="ddForm.latF" type="number" (change)="onDdChg()" step="100" min="0" max="99999"
          id="enter__Where-latF" />
        <strong>° </strong>
      </span>
      <span title="Decimal Degrees"><strong>DD</strong></span>&nbsp; or &nbsp;

      <span>
        <input #latDdmD [formField]="ddmForm.latDdmD" id="enter__Where-latDdmD" type="number" min="0" max="90"
          (change)="onDdmChg()" /><strong>°
        </strong>
        <input #latDdmM [formField]="ddmForm.latDdmM" id="enter__Where-latDdmM" type="number" min="0" max="59"
          (change)="onDdmChg()" /><strong>'
        </strong>
        <input #latDdmQ [formField]="ddmForm.latDdmQ" id="enter__Where-latDdmQ" type="text" pattern="'e','E','w','W'"
          title="E or W" (change)="onDdmChg()" />
        <span title="Degree Decimal Minutes"><strong>DDM</strong></span>&nbsp; or &nbsp;
      </span>


      <span>
        <input #latD [formField]="dmsForm.latD" id="enter__Where-latD" type="number" min="0" max="90"
          (change)="onDmsChg()" /><strong>° </strong>
        <input #latM [formField]="dmsForm.latM" id="enter__Where-latM" type="number" min="0" max="59"
          (change)="onDmsChg()" /><strong>' </strong>
        <input #latS [formField]="dmsForm.latS" id="enter__Where-latS" type="number" min="0" max="59.99"
          (change)="onDmsChg()" /><strong>"
        </strong>
        <input #latQ [formField]="dmsForm.latQ" id="enter__Where-latQ" type="text" pattern="'e','E','w','W'" title="E or W"
          (change)="onDmsChg()" />
        <span title="Degrees Minute Seconds"><strong>DMS</strong></span>
      </span>
    </div>


    <!------------------------------------------------------------>
    <div class="input-group">
      Longitude:


      <span>
        <input #lngI [formField]="ddForm.lngI" type="number" min="-180" max="180" id="enter__Where-lngI"
          (change)="onDdChg()" /><strong>.</strong>
        <input #lngF [formField]="ddForm.lngF" type="number" step="100" min="0" max="99999" id="enter__Where-lngF"
          (change)="onDdChg()" />
        <strong>° </strong><span title="Decimal Degrees"><strong>DD</strong></span>&nbsp; or &nbsp;
      </span>


      <span>
        <input #lngDdmD [formField]="ddmForm.lngDdmD" id="enter__Where-lngDdmD" type="number" min="0" max="90"
          (change)="onDdmChg()" /><strong>°
        </strong>
        <input #lngDdmM [formField]="ddmForm.lngDdmM" id="enter__Where-lngDdmM" type="number" min="0" max="59"
          (change)="onDdmChg()" /><strong>'
        </strong>
        <input #lngDdmQ [formField]="ddmForm.lngDdmQ" id="enter__Where-lngDdmQ" type="text" pattern="'n','N','s','S'"
          title="N or S" (change)="onDdmChg()" />
        <span title="Degree Decimal Minutes"><strong>DDM</strong></span>&nbsp; or &nbsp;
      </span>


      <span>
        <input [formField]="dmsForm.lngD" id="enter__Where-lngD" type="number" min="0" max="90"
          (change)="onDmsChg()" /><strong>° </strong>
        <input [formField]="dmsForm.lngM" id="enter__Where-lngM" type="number" min="0" max="59"
          (change)="onDmsChg()" /><strong>' </strong>
        <input [formField]="dmsForm.lngS" id="enter__Where-lngS" type="number" min="0" max="59.99"
          (change)="onDmsChg()" /><strong>" </strong>
        <input [formField]="dmsForm.lngQ" id="enter__Where-lngQ" type="text" pattern="'n','N','s','S'" title="N or S"
          (change)="onDmsChg()" />
        <span title="Degrees Minute Seconds"><strong>DMS</strong></span>
      </span>
    </div>



    <!------------------------------------------------------------>
    Street Address,
    <a href="https://maps.google.com/pluscodes/" target="_blank">+Code</a>, or
    <a href="https://what3words.com/about/" target="_blank">What.3.Words</a>:

    <input #address type="text" id="enter__Where-Address"
      title="Optionally enter www.Plus.Codes, www.What3Words.com, or streeet address for geocoding."
      [formField]="addressForm" data-lpignore="true" (change)="onAddressChg()" />
  </form>


  <!------------------------------------------------------------>
  <div class="enter__Where-Results">
    <!-- https://nikitahl.com/horizontal-rule-css -->
    <hr>
    <!--Derived Locations: -->
    <span id="derivedAddress" title="Normalized Address">Address:</span><br>
    <span id="pCodes" title="Global & short (Google) Plus Codes">+Codes:</span><br>
    <span id="what3Words" title="What3Words">What3Words:</span>
  </div>
</div>
