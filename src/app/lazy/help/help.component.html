<rangertrak-page [showHeader]="false">
  <div class="help-backdrop">
    <h1 split-by="letter" letter-animation="breath">
      RangerTrak&trade; - tooling for ranging Rangers
    </h1>
    <p class="help-version">Version {{version}}</p>

    <!-- E-84: this page used to be one long scroll, which is how six shipped features ended
         up documented nowhere - there was no obvious place to add them and no way to see
         what was already covered. Eight tabs, each its own component in ./tabs.

         Content rule, from the maintainer: keep it minimal, the UI should be
         self-explanatory. These tabs deliberately cover only what a screen cannot say for
         itself - consequences (what is irreversible, what is confidential), and behavior
         with no on-screen affordance (why a coordinate row vanished). Where the UI is NOT
         self-explanatory, the fix belongs in the UI, not in another paragraph here. -->
    <!-- 2026-08-29 (D-d, F29-32): reordered per that day's feedback batch - "Mission setup"
         merged into "Start here" (one onboarding checklist), FAQ moved up next to About,
         "After mission" split out of "Your data", and "Log" renamed "Feedback" (it now also
         carries the feedback form, moved on from About). -->
    <mat-tab-group class="help-tabs" mat-stretch-tabs="false" animationDuration="0ms">
      <mat-tab label="Start here">
        <rangertrak-help-start></rangertrak-help-start>
      </mat-tab>
      <mat-tab label="About">
        <rangertrak-help-about></rangertrak-help-about>
      </mat-tab>
      <mat-tab label="FAQ">
        <rangertrak-help-faq></rangertrak-help-faq>
      </mat-tab>
      <mat-tab label="Your data">
        <rangertrak-help-data></rangertrak-help-data>
      </mat-tab>
      <mat-tab label="After mission">
        <rangertrak-help-after-mission></rangertrak-help-after-mission>
      </mat-tab>
      <mat-tab label="Feedback">
        <rangertrak-help-feedback></rangertrak-help-feedback>
      </mat-tab>
    </mat-tab-group>

    <!-- E-84: was "Photo credit: Shocked Marmot from Vistapoint.net, by ___" - an unfilled
         blank shipped to production. Credited as far as is actually known. -->
    <div class="imgCredit">Photo: alpine marmot, Vistapoint.net</div>
  </div>
</rangertrak-page>
