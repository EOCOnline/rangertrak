<div class="mapLeaflet-container">
  <div class="mapLeaflet-frame">
    <div #mapContainer id="mapLeaflet-main" (click)="onMouseClick($event)"></div>
  </div>
  <!-- Raised live 2026-08-30: "the mini-map should ideally be immediately underneath the
       main map if spacing allows" - was a later sibling of the WHOLE .mapLeaflet-container
       (lat/lng status, offline buttons, and all), so it floated down near the field-report
       toggle instead. Moved to right after the frame itself, still just a float:right (see
       mapLeaflet.component.scss) - the lat/lng status and offline buttons below now wrap to
       its left instead of it landing further down the page. -->
  <div #overviewContainer id="mapLeaflet-overview"></div>
  <div>
    Latitude: <span class="strong">{{mouseLatLng().lat.toFixed(5)}}</span> Longitude:
    <span class="strong">{{mouseLatLng().lng.toFixed(5)}}</span> Zoom:
    <span class="strong">{{zoom()}}</span>

    <div id="Lmap-status">Click map to copy coordinates</div>
  </div>
  <!-- Maintainer, 2026-08-24: the offline-save control (Save this area / Remove saved
       tiles / the current-view and saved-area info lines) was floating over the map tiles
       as a Leaflet corner control - moved into normal page flow, just below the map.
       initMainMap() re-parents the control's own DOM node in here after building it. -->
  <!-- F29-21 (2026-08-30): id is a fragment-scroll target for the header readiness dot's
       "Offline map tiles saved" row - see mission-readiness.component.ts's own comment. -->
  <div #offlineControlsHost id="readiness-offline-tiles" class="offline-controls"></div>
</div>
<br />

Field reports to show: All ({{numAllRows()}})
<mat-slide-toggle (change)="onSwitchSelectedFieldReports()">
  Just those ({{numSelectedRows()}}) selected on the Radio Log page
</mat-slide-toggle>

<br />
<!-- ADR D-49: arms the next plain map click to place a Location there instead of copying
     coordinates - see placingLocation's own comment (mapLeaflet.component.ts) for why this
     is one-shot rather than a persistent mode. -->
<button matButton="outlined" type="button" (click)="onToggleAddLocation()"
  [attr.aria-pressed]="placingLocation()">
  <mat-icon>add_location</mat-icon>
  {{ placingLocation() ? 'Click the map to place it…' : 'Add Location' }}
</button>

<br />
<ng-container *ngTemplateOutlet="engineSwitchTemplate"></ng-container>
