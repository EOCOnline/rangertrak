<rangertrak-page [title]="title" [description]="pageDescr">
  <!-- E-item 13 (2026-08-27): screen-only hidden (see map-page.component.scss's own
       @media print block), shown only in a printed copy - a map on paper has no page
       title, URL bar, or app chrome to say what it is or when it was current, unlike one
       on screen. -->
  <div class="map-print-header">
    <h1>{{ (mission$ | async)?.mission || 'RangerTrak' }}</h1>
    <p>Printed {{ printedAt() | date:'medium' }}</p>
  </div>

  <div class="map-fullscreen-area" #fullscreenArea>
    <button type="button" class="fullscreen-toggle" (click)="toggleFullscreen()">
      {{ isFullscreen() ? 'Exit full screen' : 'Full screen' }}
    </button>

    <!-- Maintainer, 2026-08-24: moved below the map - was above it, ahead of the thing it
         toggles. Maintainer, 2026-08-26: moved again - above each engine's own Instructions
         section specifically, not just "somewhere after the map." Projected into whichever
         engine is mounted (below) via a template, rather than duplicated per engine or
         hoisted back above the map - state/handler stay owned here, only placement is the
         child's call. -->
    <ng-template #engineSwitchTpl>
      <div class="map-engine-switch">
        <label for="mapEngineSwitch">
          <input id="mapEngineSwitch" type="checkbox" [checked]="engine() === 'maplibre'"
            (change)="onEngineSwitchChanged($event)" />
          Use MapLibre + PMTiles Map - instead of Leaflet Map
        </label>
      </div>
    </ng-template>

    @if (engine() === 'leaflet') {
    <rangertrak-mapLeaflet [engineSwitchTemplate]="engineSwitchTpl"></rangertrak-mapLeaflet>
    } @else if (maplibreComponentType(); as MaplibreEngine) {
    <ng-container *ngComponentOutlet="MaplibreEngine; inputs: {engineSwitchTemplate: engineSwitchTpl}"></ng-container>
    }
  </div>
</rangertrak-page>
