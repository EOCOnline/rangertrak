<div>Offline-capable map (MapLibre + PMTiles). Detailed coverage is limited to the
  bundled pilot region today; panning further out shows background only.</div>

<div class="map-container">
  <div class="map-frame">
    <div #mapContainer id="pmtiles-map"></div>
  </div>
  <div>
    Latitude: <span class="strong">{{mouseLatLng().lat.toFixed(5)}}</span> Longitude:
    <span class="strong">{{mouseLatLng().lng.toFixed(5)}}</span> Zoom:
    <span class="strong">{{zoomDisplay()}}</span>
    <div id="map-status">Click map to copy coordinates</div>
  </div>
</div>
<div #overviewContainer id="pmtiles-overview"></div>
<br />

<label for="selectedFieldReportsPmtiles">Field reports to show: All ({{numAllRows()}})</label>
<input id="selectedFieldReportsPmtiles" type="checkbox" (change)="onSwitchSelectedFieldReports()" />
<label for="selectedFieldReportsPmtiles">Just those ({{numSelectedRows()}}) selected in the Field Report
  panel</label>

<div class="map-hillshade-toggle">
  <label for="pmtilesHillshadeToggle">
    <input id="pmtilesHillshadeToggle" type="checkbox" [checked]="hillshadeVisible()"
      (change)="onToggleHillshade($event)" />
    Show terrain relief (hillshade)
  </label>
</div>

<ng-container *ngTemplateOutlet="engineSwitchTemplate"></ng-container>
