<h2>Location Categories</h2>
<p>Categories available when placing a Location on the map (Command Post, Staging Area, ...).
  Each draws with its own icon and colour.</p>

<ag-grid-angular (gridReady)="onGridReady($event)" [gridOptions]="gridOptions"
  [defaultColDef]="defaultColDef" [tooltipShowDelay]="500" [rowData]="rowData" [columnDefs]="columnDefs">
</ag-grid-angular>

<button (click)="onBtnAddLocationType()" title="Add a new Location category">
  Add new row
</button>
