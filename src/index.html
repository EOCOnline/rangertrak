  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <!-- E-62 cheap tier: iOS/iPadOS ignores favicon.ico and manifest.webmanifest's icons
       for "Add to Home Screen" - without this it fell back to a screenshot thumbnail
       instead of the app's actual mark. Flattened onto the app's ground token (#EDF1F5)
       rather than left transparent - Apple's own guidance, since iOS composites this
       under its own rounded-corner mask and does not handle alpha well. -->
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">

  <!--lik rel="icon" type="image/svg+xml" href="/src/favicon.svg">
  <lik rel="icon" type="image/ico" href="/src/favicon.ico" -->

    rel="stylesheet">

  <!-- E-42: theme-color was Angular Material's default blue (#1976d2), unrelated to the
       app's actual Command skin accent (#0B5FA8, ADR D-37) - this is what colours the
       browser chrome/status bar around an installed PWA, so it was one more place the
       Angular-default identity was leaking through. Was also duplicated (this link/meta
       pair appeared twice) and, above, a malformed meta tag that mixed an HTTP header
       fragment into an HTML attribute and never set a real theme-color value at all. -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0B5FA8">
  <script>
      // Applies a saved light/dark override before Angular (and its stylesheet) loads, so a
      // scribe who picked one doesn't see a flash of the OS-default scheme first. 'themeMode'
      // must match THEME_MODE_KEY in src/app/shared/services/theme.service.ts, which owns this
      // key from here on; 'auto' (or nothing stored) leaves color-scheme unset, so styles.scss's
      // `light dark` default (follow the OS/browser) applies untouched.
      try {
        var rtThemeMode = localStorage.getItem('themeMode');
        if (rtThemeMode === 'light' || rtThemeMode === 'dark') {
          document.documentElement.style.colorScheme = rtThemeMode;
        }
      } catch (e) { /* localStorage unavailable (e.g. blocked in this context) - fall back to auto */ }
  </script>
  <script>

  </script>
