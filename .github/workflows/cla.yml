# Gates external pull requests on signing CLA.md (E-23 / ADR D-01). Not yet enabled — see the
# DRAFT notice at the top of CLA.md; needs the maintainer's placeholder fields filled in and
# a PERSONAL_ACCESS_TOKEN secret (repo scope) created before this can actually comment/commit
# signatures. Until that secret exists, runs of this workflow fail rather than silently no-op.
name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla-check:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_SIGNATURES_TOKEN }}
        with:
          path-to-signatures: "signatures/cla.json"
          path-to-document: "https://github.com/${{ github.repository }}/blob/main/CLA.md"
          branch: "cla-signatures"
          allowlist: JCornelison
          custom-pr-sign-comment: "I have read the CLA Document and I hereby sign the CLA"
          custom-notsigned-prcomment: >
            Thanks for the pull request! Before it can be reviewed, please read
            [CLA.md](https://github.com/${{ github.repository }}/blob/main/CLA.md) and reply
            to this comment with: `I have read the CLA Document and I hereby sign the CLA`
